name: Skill package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: skill metadata and tarball (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # No dependency install is needed for this documentation-only package.
      - name: Require a version bump when published files change
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
        run: node scripts/check-version-bump.mjs "$BASE_REF"
      - name: Validate frontmatter, release target and package/plugin versions
        run: npm test
      - name: Verify shipped files
        run: npm pack --dry-run --ignore-scripts
